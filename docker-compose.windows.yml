services:
  brok:
    build:
      context: .
    image: brok:local
    container_name: brok-app-windows
    pull_policy: never
    env_file:
      - .env

    environment:
      - QT_QPA_PLATFORM=xcb
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_INDIRECT=1

    volumes:
      - ./brok:/app/brok
    restart: "no"