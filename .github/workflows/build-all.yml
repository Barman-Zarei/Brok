name: Build all platforms

# Turns this branch into OS-specific files with GitHub Actions: Windows .exe, macOS .app (Apple Silicon + Intel,
# zipped) and a Linux binary (.tar.gz). Runs on every push, on pull requests and on demand; artefacts are attached
# to the run (Actions tab -> the run -> Artifacts). It never publishes anything: PyPI/Releases are separate.
#
# Per-branch knobs live in the `env:` block below, so a branch only edits these lines.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.9"        # interpreter used for the frozen build
  EXTRA_PIP: "openai"           # optional deps to bundle (a frozen app cannot `pip install` later)
  BRANCH_LABEL: ${{ github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          [ -z "$EXTRA_PIP" ] || pip install $EXTRA_PIP
      - name: Build
        run: pyinstaller --noconfirm brok.spec
      - name: Name the artefact
        shell: bash
        run: |
          safe="$(echo "$BRANCH_LABEL" | tr '/ ' '--')"
          mv dist/brok.exe "dist/brok-${safe}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: brok-windows
          path: dist/brok-*-windows-x64.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          [ -z "$EXTRA_PIP" ] || pip install $EXTRA_PIP
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: pyinstaller --noconfirm brok.spec
      - name: Zip the .app
        run: |
          safe="$(echo "$BRANCH_LABEL" | tr '/ ' '--')"
          cd dist && ditto -c -k --keepParent brok.app "brok-${safe}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: brok-macos-arm64
          path: dist/brok-*-macos-arm64.zip
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    continue-on-error: true   # Intel runners are being phased out; do not fail the branch for it
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          [ -z "$EXTRA_PIP" ] || pip install $EXTRA_PIP
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: pyinstaller --noconfirm brok.spec
      - name: Zip the .app
        run: |
          safe="$(echo "$BRANCH_LABEL" | tr '/ ' '--')"
          cd dist && ditto -c -k --keepParent brok.app "brok-${safe}-macos-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: brok-macos-intel
          path: dist/brok-*-macos-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04     # an older glibc than ubuntu-latest, so the binary runs on more distros
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          [ -z "$EXTRA_PIP" ] || pip install $EXTRA_PIP
      - name: Build
        run: pyinstaller --noconfirm brok.spec
      - name: Smoke test (starts headless, must not crash)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 15 ./dist/brok > smoke.log 2>&1
          code=$?
          cat smoke.log | tail -20
          # 0 = exited cleanly, 124 = still running when the timeout hit: both mean "started fine"
          if grep -qiE "traceback|importerror" smoke.log; then echo "start-up error"; exit 1; fi
          [ $code -eq 0 ] || [ $code -eq 124 ]
      - name: Pack
        run: |
          safe="$(echo "$BRANCH_LABEL" | tr '/ ' '--')"
          cd dist && tar -czf "brok-${safe}-linux-x64.tar.gz" brok
      - uses: actions/upload-artifact@v4
        with:
          name: brok-linux
          path: dist/brok-*-linux-x64.tar.gz
          if-no-files-found: error
