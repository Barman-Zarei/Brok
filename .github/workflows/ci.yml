name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]  # PySide6 6.6.3.1 / Pillow<11 have no 3.13 wheels
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Qt's offscreen platform plugin needs a few system libs even headless.
      - name: Install Qt runtime libs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-forked pytest-timeout
          # [calendar] pulls icalendar/recurring-ical-events so the calendar
          # tests actually run (they hard-require the parser libs).
          pip install .[calendar]

      - name: Ruff
        run: ruff check .

      # Each test runs in its own forked process: Qt's offscreen platform is
      # unstable when many tests share one process (a later Qt test can crash or
      # hang on an earlier test's teardown). --timeout bounds any stuck test to
      # seconds; --timeout-method=thread is required to bound a hang under --forked.
      - name: Type check (new Brok modules, strict)
        if: matrix.python-version == '3.12'
        run: |
          pip install mypy
          mypy --python-version 3.10 --strict --ignore-missing-imports --follow-imports=silent brok/ai brok/agent brok/avatar brok/voice brok/web brok/config.py brok/core.py brok/cli.py brok/commands.py brok/memory.py brok/privacy.py brok/plugins.py brok/hotkey.py brok/hotkey_qt.py brok/productivity.py brok/github_agent.py brok/logging_setup.py brok/chat_commands.py brok/llm_claude.py brok/workspace_ui.py brok/quick.py brok/privacy_ui.py

      - name: Package validation
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # No API keys are needed: providers are tested against fake transports.
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --forked --timeout=60 --timeout-method=thread

  # Windows / macOS smoke run. These platforms were never run by the author of this migration, so failures here are
  # expected to be informative, not a regression: fix forward or mark the specific test with a skipif.
  cross-platform:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-forked pytest-timeout
          pip install .[calendar]
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --timeout=60 --timeout-method=thread
