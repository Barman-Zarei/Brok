[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brok"
version = "0.2.0"
description = "Brok: a Persian-first AI desktop companion and permission-controlled coding agent (Qt overlay)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Barman" }]
license = { file = "LICENSE.txt" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    "pillow>=10.4",
    # 6.6.3.1 is the newest PySide6 wheel that installs on Python 3.8.
    "pyside6>=6.6.3",
    # Global key/click COUNTS (the key identity is discarded in the hook — only
    # an integer survives), so the counts work out of the box on a plain
    # `pip install brok` everywhere, including the prebuilt exe.
    #   - Windows/macOS: pynput (installs cleanly there).
    #   - Linux: python-xlib, a pure-Python X11 backend with wheels. We avoid
    #     pynput on Linux because it hard-requires `evdev`, a C extension with no
    #     wheel that would make `pip install brok` fail to build without a
    #     compiler. Off X11 (Wayland) it degrades to cursor-only.
    "pynput>=1.7; sys_platform != 'linux'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ruff>=0.14.3",
    "pytest>=8.0",
    # Run each test in its own process (Qt's offscreen platform is unstable
    # across tests in one process); pytest-timeout bounds any stuck test.
    "pytest-forked>=1.6",
    "pytest-timeout>=2.0",
]

# Optional: store API keys in the OS keyring instead of plaintext config.
[project.optional-dependencies]
secure = ["keyring>=24"]
# Global hotkey (Ctrl+Space by default). On Linux pynput pulls evdev (needs a compiler), so it is opt-in there:
#   pip install "brok[hotkey]"
hotkey = ["pynput>=1.7"]
# Offline speech-to-text (Whisper) and microphone capture for the voice pipeline.
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]
# ICS calendar reminders: RRULE expansion (the daily standup) is a swamp not
# worth hand-rolling, so the calendar feature needs these two small libs.
calendar = ["icalendar>=6", "recurring-ical-events>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Console script `brok` → calls brok.main:main
[project.urls]
Homepage = "https://github.com/Barman-Zarei/Brok"
Repository = "https://github.com/Barman-Zarei/Brok"
Issues = "https://github.com/Barman-Zarei/Brok/issues"
Upstream = "https://github.com/yumiaura/myCat"

[project.scripts]
brok = "brok.main:main"
brok-agent = "brok.cli:main"

[tool.setuptools.packages.find]
include = ["brok*"]

# Bundle non-Python data inside the wheel: char zips, the plane sprite and the
# prompt template.
[tool.setuptools.package-data]
brok = ["chars/*", "chars/*/*", "assets/*", "assets/planes/*", "assets/fonts/*", "locale/*.json", "*.j2"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["README.md", "docs/*"]

[tool.ruff.lint]
select = ["C4", "E", "F", "I", "PERF", "UP"]
ignore = ["PERF203"]
