name: Build .deb

# Same tag trigger as publish.yml / release-binaries.yml. Wraps the PyInstaller
# onefile Linux binary in a Debian package and attaches it to the GitHub Release
# for that tag. Kept in its own workflow so it stays independent of the native
# binary matrix. Also dispatchable to produce the .deb as an artefact without a
# real release tag.

on:
  push:
    tags:
      - "*.*.*"
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # attach the .deb to the GitHub Release

jobs:
  build-deb:
    # The oldest supported Ubuntu LTS, not ubuntu-latest: the binary links
    # against the runner's glibc, and one built on 24.04 needs GLIBC_2.38 and
    # will not start on 22.04. Same reason as build-appimage.yml.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the X libraries Qt's xcb plugin loads
        # PyInstaller bundles only the libraries it finds on this machine, and
        # the runner lacks several of these. Without them the binary quits on
        # any system that lacks them too: "no Qt platform plugin could be
        # initialized". Same list as build-appimage.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxkbcommon0

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          # openai is optional, but a frozen binary can't pip-install later —
          # bundling it here makes --openai work out of the box.
          pip install openai

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm brok.spec

      - name: Assemble .deb
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Non-tag (manual dispatch) build: take the version from pyproject so a
            # dispatched build of a release commit yields a correctly-versioned
            # package — e.g. to backfill a release that predates this workflow.
            VERSION="$(grep -m1 -E '^version *= *' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          PKG="brok_${VERSION}_amd64"
          root="pkg/${PKG}"
          mkdir -p "$root/DEBIAN" \
                   "$root/usr/bin" \
                   "$root/usr/share/applications" \
                   "$root/usr/share/icons/hicolor/256x256/apps"
          install -m0755 dist/brok "$root/usr/bin/brok"
          install -m0644 packaging/brok.desktop "$root/usr/share/applications/brok.desktop"
          # Record the version so the in-app "newest install wins" menu logic can
          # compare this .deb against a git/pip/AppImage run.
          echo "X-brok-version=${VERSION}" >> "$root/usr/share/applications/brok.desktop"
          install -m0644 packaging/brok.png "$root/usr/share/icons/hicolor/256x256/apps/brok.png"
          # AppStream metadata, so software centres show a summary and a screenshot.
          install -Dm0644 packaging/io.github.Barman_Zarei.Brok.metainfo.xml "$root/usr/share/metainfo/io.github.Barman_Zarei.Brok.metainfo.xml"
          sed "s/@VERSION@/${VERSION}/" packaging/control.in > "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root"
          # Internal control keeps the real version; the file name is version-less
          # so /releases/latest/download/brok-linux-amd64.deb is a stable link.
          mv "pkg/${PKG}.deb" "brok-linux-amd64.deb"
          echo "::group::deb info";     dpkg-deb --info "brok-linux-amd64.deb";     echo "::endgroup::"
          echo "::group::deb contents"; dpkg-deb --contents "brok-linux-amd64.deb"; echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        with:
          name: brok-deb
          path: brok-linux-amd64.deb
          if-no-files-found: error

      - name: Attach .deb to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: brok-linux-amd64.deb
          fail_on_unmatched_files: true
